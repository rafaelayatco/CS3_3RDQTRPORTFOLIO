<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2nd Quarter Portfolio">
    <meta name="keywords" content="HTML basic tags">
    <meta name="author" content="R YATCO">

    <title>4th Quarter Portfolio</title>
    <link rel="icon" type="image/png" href="CS3_2NDQTRPORTFOLIO/assets/pshslogo.png">

<style>

@font-face {
  font-family: 'PopStar';
  src: url('assets/MGF-PopstarPersonalUse.otf') format('opentype');
}

@font-face {
  font-family: 'Voltra';
  src: url('assets/Voltra.ttf') format('truetype');
}

body {
    font-family: 'Voltra', Arial, sans-serif;
    background:#ffccdd;
    padding:30px;
}

h3 {
    font-family: 'Voltra', Arial, sans-serif;
}

button {
    font-family: 'Voltra', Arial, sans-serif;
}

.container{
    width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
    font-family: 'PopStar', sans-serif;
    color: rgb(154, 15, 38);
    text-align:center;
    margin-bottom:15px;
}

label{
    font-size:14px;
    margin-top:8px;
    display:block;
}

input,select{
    width:100%;
    padding:6px;
    margin-top:4px;
    border:1px solid #ccc;
    border-radius:4px;
}

.stars{
    margin-top:5px;
}

.star{
    font-size:20px;
    cursor:pointer;
    color:#ccc;
}

.star.selected{
    color:yellow;
}

button{
    width:100%;
    margin-top:12px;
    padding:8px;
    background:#e85990;
    border:none;
    color:white;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#44ffef;
}

#movieList{
    margin-top:20px;
}

.movieItem{
    background:#fafafa;
    padding:8px;
    margin-top:8px;
    border-radius:4px;
    font-size:13px;
}

.movieItem button{
    width:auto;
    padding:4px 8px;
    font-size:11px;
    margin-top:5px;
    background:#601515;
}

.movieItem .star{
    font-size:18px;
    color:#ccc;
}

.movieItem .star.selected{
    color:yellow;
}
</style>
</head>

<body>

<div class="container">

<h2>Add / Update a Movie</h2>

<form id="movieForm">

<label>Title:</label>
<input type="text" id="title" placeholder="Enter movie name" required>

<label>Year:</label>
<input type="number" id="year" placeholder="example: 2025" required>

<label>Genre:</label>
<select id="genre" required>
<option value="" disabled selected>Select</option>
<option>Action</option>
<option>Animated</option>
<option>Romance</option>
<option>Comedy</option>
<option>Drama</option>
<option>Horror</option>
<option>Science Fiction</option>
<option>Thriller</option>
<option>Documentary</option>
<option>Biography</option>
<option>Others</option>

</select>

<label>Rating:</label>
<div class="stars" id="starContainer">
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>

<button type="submit">Add Movie</button>

</form>

<h3 style="text-align:center;margin-top:15px;">Movie List</h3>

<div id="movieList"></div>

</div>

<script>


const form = document.getElementById("movieForm");
const movieList = document.getElementById("movieList");
const stars = document.querySelectorAll("#starContainer .star");

let rating = 0;

// Shows the main important HTML elements


stars.forEach(star=>{
    star.addEventListener("click", ()=>{
        rating = Number(star.dataset.value);
        updateStars(rating);
    });
});
// This above will store the rating

// The star will change appearance after interaction
function updateStars(value){
    stars.forEach(star=>{
        if(Number(star.dataset.value) <= value){
            star.classList.add("selected");
        } else{
            star.classList.remove("selected");
        }
    });
}


// Displays all movies stored in localStorage
function displayMovies(){

    movieList.innerHTML="";

    const movies = JSON.parse(localStorage.getItem("movies")) || [];

    movies.forEach((movie,index)=>{

        const div = document.createElement("div");
        div.classList.add("movieItem");

        let starHtml="";

        // Puts the score of the movie in stars
        for(let i=1;i<=5;i++){
            if(i <= movie.rating){
                starHtml += '<span class="star selected">★</span>';
            }else{
                starHtml += '<span class="star">★</span>';
            }
        }

        div.innerHTML = `
        <strong>${movie.title}</strong> (${movie.year}) - ${movie.genre}<br>
        Rating: ${starHtml}<br>
        <button onclick="deleteMovie(${index})">Delete</button>
        `;

        movieList.appendChild(div);
    });

}


// Adds or remove movie listings 
form.addEventListener("submit", function(e){

    e.preventDefault();

    const title = document.getElementById("title").value.trim();
    const year = document.getElementById("year").value.trim();
    const genre = document.getElementById("genre").value;

    if(!title || !year || rating===0){
        alert("Fill all fields and select rating");
        return;
    }

    let movies = JSON.parse(localStorage.getItem("movies")) || [];
    const existingIndex = movies.findIndex(
        movie => movie.title.toLowerCase() === title.toLowerCase()
    );

    if(existingIndex !== -1){

        const oldRating = movies[existingIndex].rating;
        const newRating = Math.round((oldRating + rating) / 2);

        movies[existingIndex] = {
            title,
            year,
            genre,
            rating:newRating
        };

    }else{
        movies.push({title,year,genre,rating});
    }

    localStorage.setItem("movies", JSON.stringify(movies));

    form.reset();
    rating=0;
    updateStars(0);

    displayMovies();

});


// Deletes movie after confirmation
function deleteMovie(index){

    const confirmDelete = confirm("Are you sure you want to delete this?");

    if(confirmDelete){

        let movies = JSON.parse(localStorage.getItem("movies")) || [];

        movies.splice(index,1);

        localStorage.setItem("movies", JSON.stringify(movies));

        displayMovies();
    }

}

displayMovies(); // shows the movies given

</script>

</body>
</html>
