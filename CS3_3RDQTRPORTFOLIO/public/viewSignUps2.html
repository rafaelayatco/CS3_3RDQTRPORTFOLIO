<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3rd Quarter Portfolio">
    <meta name="keywords" content="2nd Graded Exercise">
    <meta name="author" content="R YATCO">

    <title>Centralized Club/Organization Application Form</title>
    <link rel="icon" type="image/png" href="../../CS3_2NDQTRPORTFOLIO/assets/pshslogo.png">

<style>
body {
  font-family: 'Aptos', sans-serif;
  background-color: #fff0f5; 
  padding: 20px;
  color: #333;
}

h2 {
  text-align: center;
  color: #cc0066; 
  margin-bottom: 20px;
}

label {
  font-weight: 500;
  margin-right: 10px;
}

select {
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid #aaa;
  transition: all 0.3s ease;
}

select:focus {
  background-color: #fff9a6; 
  border-color: #cc0066; 
  outline: none;
  box-shadow: 0 0 8px rgba(204,0,102,0.3);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(204,0,102,0.1);
}

th, td {
  padding: 12px 10px;
  text-align: center;
}

th {
  background: linear-gradient(135deg, #ff99cc, #ff66aa); 
  color: white;
  font-size: 1em;
}

tr:nth-child(even) {
  background-color: #ffe6f0; 
}

tr:hover {
  background-color: #ffd5e5; 
  transition: background-color 0.3s ease;
}

.message {
  margin-top: 15px;
  color: #cc0066;
  font-weight: bold;
  text-align: center;
}

a {
  display: inline-block;
  margin-top: 20px;
  color: #cc0066;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
}

a:hover {
  color: #ff3399;
  text-decoration: underline;
}
</style>
</head>

<body>

<h2>List of Students who Signed Up</h2>

<label>
Filter by Club:
<select id="clubFilter">
  <option value="ALL">ALL</option>
  <option value="Invictus">Invictus</option>
  <option value="Flux">Flux</option>
  <option value="Alianti">Alianti</option>
  <option value="Labuyo">Labuyo</option>
  <option value="Likha">Likha</option>
  <option value="Model United Nations">Model United Nations</option>
</select>
</label>

<p>Total Sign-Ups: <span id="total">0</span></p>

<div id="output"></div>

<a href="Q3_2GBerylliumYatco.html">← Back to Sign-Up Page</a>

<script>
const signups = JSON.parse(localStorage.getItem("clubSignups")) || [];
const output = document.getElementById("output");
const total = document.getElementById("total");
const filter = document.getElementById("clubFilter");

function displaySignups() {
  // If no sign-ups at all
  if (signups.length === 0) {
    output.innerHTML = "<p class='message'>No sign-ups saved.</p>";
    total.textContent = 0;
    return;
  }

  // Filter by club
  let list = filter.value === "ALL" ? signups : signups.filter(s => s.club === filter.value);

  // If filtered club has no sign-ups in its list this shows
  if (list.length === 0) {
    output.innerHTML = "<p class='message'>No sign-ups for this club.</p>";
    total.textContent = 0;
    return;
  }

  let html = `<table>
    <tr>
      <th>Club</th>
      <th>Student ID</th>
      <th>Full Name</th>
      <th>Grade Level</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Intern/Extern</th>
    </tr>`;

  list.forEach(s => {
    html += `<tr>
      <td>${s.club}</td>
      <td>${s.student_id}</td>
      <td>${s.full_name}</td>
      <td>${s.grade_level}</td>
      <td>${s.email}</td>
      <td>${s.mobile}</td>
      <td>${s.status}</td>
    </tr>`;
  });

  html += "</table>";
  output.innerHTML = html;
  total.textContent = list.length;
}

filter.addEventListener("change", displaySignups);
displaySignups();
</script>

</body>
</html>
